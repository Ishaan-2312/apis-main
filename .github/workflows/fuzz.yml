name: Automated Autofuzz Testing

on:
  push:
    branches: [ "fuzz-testing" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  autofuzz:
    name: Run Jazzer Autofuzz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. First, compile the project to generate the target .class/.jar files
      - name: Build project
        run: mvn clean package -DskipTests

      # 2. Download the standalone Jazzer binary
      - name: Download Jazzer
        run: |
          wget https://github.com/CodeIntelligenceTesting/jazzer/releases/download/v0.22.1/jazzer-linux.tar.gz
          tar -zxvf jazzer-linux.tar.gz

      # 3. Run Autofuzz on your specific target class and method
      - name: Run Autofuzz
        run: |
          ./jazzer \
            --cp=target/*.jar \
            --target_class=com.yourpackage.YourInputClass \
            --target_method=yourInputHandlerMethod \
            --autofuzz=com.yourpackage.YourInputClass::yourInputHandlerMethod \
            --keep_going=1 \
            -timeout=60